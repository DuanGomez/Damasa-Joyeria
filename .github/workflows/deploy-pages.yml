# Publica el sitio estático en GitHub Pages.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo los archivos del sitio (sin los mockups de diseño).
      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html producto.html styles.css dcodea-dna.css script.js catalog.js producto.js images .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
